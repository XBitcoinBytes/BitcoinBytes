<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Base metadata — route-specific overrides set via usePageMeta hook -->
    <title>BitcoinBytes — Compare Bitcoin Purchase Prices</title>
    <meta name="description" content="Find the best price to buy Bitcoin across exchanges. Ranked by BTC received after fees, using live order books and verified published fee schedules. No fabricated data." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f7931a" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BitcoinBytes" />
    <meta property="og:title" content="BitcoinBytes — Compare Bitcoin Purchase Prices" />
    <meta property="og:description" content="Find the best price to buy Bitcoin. Live order books, verified fees, no fabricated data." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@xbitcoinbytes" />
    <meta name="twitter:title" content="BitcoinBytes — Compare Bitcoin Purchase Prices" />
    <meta name="twitter:description" content="Live order-book comparison. Find the most BTC for your USD." />

    <!-- Canonical — updated per route by usePageMeta -->
    <link rel="canonical" href="https://xbitcoinbytes.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BitcoinBytes",
      "description": "Bitcoin purchase price comparison tool using live order books and verified exchange fees.",
      "url": "https://xbitcoinbytes.com",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
